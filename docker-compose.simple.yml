version: '3.8'

services:
  # Obsidian RAG MCP Server - lightweight container
  obsidian-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obsidian-rag-mcp
    restart: unless-stopped
    ports:
      - "3000:3000"  # HTTP/SSE endpoint for MCP
    environment:
      # Data source
      - OBSIDIAN_RAG_SOURCE=${OBSIDIAN_RAG_SOURCE:-couchdb}
      
      # CouchDB settings (external)
      - OBSIDIAN_RAG_COUCH_URL=${OBSIDIAN_RAG_COUCH_URL:-http://couchdb:5984}
      - OBSIDIAN_RAG_COUCH_DB=${OBSIDIAN_RAG_COUCH_DB:-obsidian}
      - OBSIDIAN_RAG_COUCH_USER=${OBSIDIAN_RAG_COUCH_USER}
      - OBSIDIAN_RAG_COUCH_PASSWORD=${OBSIDIAN_RAG_COUCH_PASSWORD}
      
      # Embedding provider (external LLM)
      - OBSIDIAN_RAG_PROVIDER=${OBSIDIAN_RAG_PROVIDER:-openai}
      
      # OpenAI settings
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OBSIDIAN_RAG_MODEL=${OBSIDIAN_RAG_MODEL:-text-embedding-3-small}
      
      # Ollama settings (external)
      - OBSIDIAN_RAG_OLLAMA_URL=${OBSIDIAN_RAG_OLLAMA_URL:-http://localhost:11434}
      - OBSIDIAN_RAG_OLLAMA_API_KEY=${OBSIDIAN_RAG_OLLAMA_API_KEY}
      - OBSIDIAN_RAG_OLLAMA_MODEL=${OBSIDIAN_RAG_OLLAMA_MODEL:-nomic-embed-text}
      
      # LM Studio settings (external)
      - OBSIDIAN_RAG_LMSTUDIO_URL=${OBSIDIAN_RAG_LMSTUDIO_URL:-http://localhost:1234}
      - OBSIDIAN_RAG_LMSTUDIO_API_KEY=${OBSIDIAN_RAG_LMSTUDIO_API_KEY}
      - OBSIDIAN_RAG_LMSTUDIO_MODEL=${OBSIDIAN_RAG_LMSTUDIO_MODEL:-text-embedding-nomic-embed-text-v1.5}
      
      # MCP Server settings
      - MCP_SERVER_PORT=3000
      - MCP_SERVER_TOKEN=${MCP_SERVER_TOKEN}  # Bearer token for authentication
      
      # Data storage
      - OBSIDIAN_RAG_DATA=/data
      
      # Logging
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - rag-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Watcher service for auto-indexing (optional)
  obsidian-watcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obsidian-rag-watcher
    restart: unless-stopped
    command: ["python", "-m", "obsidian_rag.cli", "watch"]
    environment:
      # Same environment as main service
      - OBSIDIAN_RAG_SOURCE=${OBSIDIAN_RAG_SOURCE:-couchdb}
      - OBSIDIAN_RAG_COUCH_URL=${OBSIDIAN_RAG_COUCH_URL}
      - OBSIDIAN_RAG_COUCH_DB=${OBSIDIAN_RAG_COUCH_DB:-obsidian}
      - OBSIDIAN_RAG_COUCH_USER=${OBSIDIAN_RAG_COUCH_USER}
      - OBSIDIAN_RAG_COUCH_PASSWORD=${OBSIDIAN_RAG_COUCH_PASSWORD}
      - OBSIDIAN_RAG_PROVIDER=${OBSIDIAN_RAG_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OBSIDIAN_RAG_MODEL=${OBSIDIAN_RAG_MODEL}
      - OBSIDIAN_RAG_OLLAMA_URL=${OBSIDIAN_RAG_OLLAMA_URL}
      - OBSIDIAN_RAG_OLLAMA_API_KEY=${OBSIDIAN_RAG_OLLAMA_API_KEY}
      - OBSIDIAN_RAG_OLLAMA_MODEL=${OBSIDIAN_RAG_OLLAMA_MODEL}
      - OBSIDIAN_RAG_LMSTUDIO_URL=${OBSIDIAN_RAG_LMSTUDIO_URL}
      - OBSIDIAN_RAG_LMSTUDIO_API_KEY=${OBSIDIAN_RAG_LMSTUDIO_API_KEY}
      - OBSIDIAN_RAG_LMSTUDIO_MODEL=${OBSIDIAN_RAG_LMSTUDIO_MODEL}
      - OBSIDIAN_RAG_DATA=/data
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - rag-data:/data
    depends_on:
      obsidian-rag:
        condition: service_healthy

volumes:
  rag-data: